name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: tu_parser
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: tu_parser.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin }} -DestinationPath tu_parser-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf tu_parser-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.bin }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: tu_parser-*
          generate_release_notes: true
