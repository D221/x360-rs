name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --verbose
      - name: Build release
        run: cargo build --release --locked --verbose
      - name: Package x360-menu.bat with binary
        shell: bash
        run: |
          cp x360-menu.bat target/release/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -Command "Compress-Archive -Path 'target/release/x360-rs.exe', 'target/release/x360-menu.bat' -DestinationPath 'x360-rs-windows-latest.zip'"
          else
            zip x360-rs-ubuntu-latest.zip target/release/x360-rs target/release/x360-menu.bat
          fi
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: x360-rs-${{ runner.os }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
